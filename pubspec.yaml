name: rever
description: "Sonidos en reversa"
publish_to: 'none'

version: 1.0.1+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_mobile_ads: ^5.2.0
  percent_indicator: ^4.2.5
  google_fonts: ^8.2.1
  record: ^6.2.1
  path_provider: ^2.1.6
  permission_handler: ^12.0.1
  just_audio: ^0.10.6
  flutter_dotenv: ^5.2.1
  webview_flutter: ^4.14.1
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/icon/
    - .env

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo_actual.png"
  min_sdk_android: 24
